name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lola
          POSTGRES_PASSWORD: lola_dev
          POSTGRES_DB: lola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lola -d lola"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://app_user:app_user_dev@localhost:5432/lola
      DATABASE_ADMIN_URL: postgres://lola:lola_dev@localhost:5432/lola
      PLATFORM_DATABASE_URL: postgres://platform_admin:platform_admin_dev@localhost:5432/lola
      ENCRYPTION_KEY: ci-encryption-key
      SESSION_SECRET: ci-session-secret
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: lola-media
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Сквозные проверки пакета docs/v2 (HANDOFF.md §7.3, docs/v2/45-plan.md PR-01):
      # коды этапов, фильтр users.kind, обход withTenant(), i18n, токены бренд-бука.
      - name: Сквозные проверки docs/v2
        run: scripts/v2-crosschecks.sh

      # Хранилище S3 для тестов (медиа, PDF сертификата, выгрузки отчётов).
      #
      # Почему не MinIO — чтобы следующий не «вернул как было»: 24.09.2026 образ пропал
      # отовсюду разом. quay.io/minio/minio отдаёт анонимным клиентам 401 на любой тег,
      # включая latest и наш пин RELEASE.2024-12-18T13-15-44Z; на Docker Hub репозитория
      # minio/minio больше нет (404); прямая загрузка бинарника с dl.min.io — 410 Gone.
      # Запасной реестр тут не помогает: образа нет ни по одному адресу, нужна замена.
      #
      # adobe/s3mock — S3-совместимый сервер для тестов. Проверено прогоном тех спек,
      # что реально ходят в хранилище (v2-media-storage, debts-2, debts-8, attempts,
      # spec22-reports, reports-scope, tenancy, extract-tenant): он держит весь набор,
      # который нужен приложению, — presigned PUT и GET (SigV4, X-Amz-Expires,
      # переопределение response-content-type/disposition для SVG, D-011), PutObject
      # и GetObject с aws-chunked телом от AWS SDK v3, HeadObject, HeadBucket/CreateBucket,
      # постраничный ListObjectsV2 и массовый DeleteObjects (purge тенанта, docs/25 §8).
      # Multipart-загрузки в коде нет — ни один сервис не берёт @aws-sdk/lib-storage.
      # Приложение подмены не видит: S3_* прежние, порт 9000 прежний, path-style прежний.
      # Ключи не проверяются — S3_ACCESS_KEY/S3_SECRET_KEY здесь просто заполнены.
      #
      # Прод (docker/docker-compose.prod.yml) и демо-стенд (docker-compose.demo.yml)
      # ссылаются на тот же недоступный образ MinIO — решение по ним принимает владелец
      # продукта (HANDOFF §6), риск записан в docs/v2/46-progress.md.
      - name: S3 для тестов (adobe/s3mock вместо MinIO — см. комментарий выше)
        run: |
          docker run -d --name s3 -p 9000:9090 adobe/s3mock:5.2.3
          for i in $(seq 1 60); do curl -sf http://localhost:9000/ >/dev/null && break; sleep 1; done
          # Бакет заводится явно, тем же именем, что в S3_BUCKET; заодно это и проверка живости
          curl -sf -o /dev/null -X PUT "http://localhost:9000/$S3_BUCKET"

      # Mailpit для тестов почты (OTP на e-mail, SMTP тенанта): порт 1025, как в docker/docker-compose.yml
      - name: Mailpit
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.21
          for i in $(seq 1 30); do curl -sf http://localhost:8025/api/v1/info >/dev/null && break; sleep 1; done

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      # Build идёт до тестов: scopes-http.spec.ts гоняет собранное приложение
      - name: Tests (unit + integration + http)
        run: pnpm test

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (docs/06 §6.10 + сценарии этапов 8–10)
        run: pnpm test:e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Визуальные тесты по мокапам (docs/28 «visual-mockups», docs/32 §Б строка 21): скриншоты
  # приложения против эталонов из docs/mockups + структурные проверки текстов мокапа.
  # continue-on-error на шаге теста — расхождения складываются в список долгов (docs/31),
  # не блокируют мердж; это отдельный от `ci` сигнал, поэтому свой job, свои сервисы/сид.
  visual:
    needs: ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lola
          POSTGRES_PASSWORD: lola_dev
          POSTGRES_DB: lola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lola -d lola"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://app_user:app_user_dev@localhost:5432/lola
      DATABASE_ADMIN_URL: postgres://lola:lola_dev@localhost:5432/lola
      PLATFORM_DATABASE_URL: postgres://platform_admin:platform_admin_dev@localhost:5432/lola
      ENCRYPTION_KEY: ci-encryption-key
      SESSION_SECRET: ci-session-secret
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: lola-media
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # S3 для тестов — adobe/s3mock, не MinIO. Почему именно так и что проверено —
      # в развёрнутом комментарии к такому же шагу в джобе `ci` выше.
      - name: S3 для тестов (adobe/s3mock вместо MinIO)
        run: |
          docker run -d --name s3 -p 9000:9090 adobe/s3mock:5.2.3
          for i in $(seq 1 60); do curl -sf http://localhost:9000/ >/dev/null && break; sleep 1; done
          curl -sf -o /dev/null -X PUT "http://localhost:9000/$S3_BUCKET"

      - name: Migrate + сид
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Эталоны из docs/mockups
        run: pnpm visual:mockups

      - name: Визуальные тесты
        id: visual
        continue-on-error: true
        run: pnpm visual
        env:
          CI: "1"

      - name: Итог в сводку CI
        if: always()
        run: |
          echo "### Визуальные тесты по мокапам (docs/32 §Б строка 21)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node scripts/visual-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Полный html-отчёт — в артефакте \`visual-report\`. Расхождения не блокируют мердж (docs/28 «visual-mockups»)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: visual-report/
          retention-days: 7

  image:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (docs/26)
        run: docker build -f docker/Dockerfile -t lola/app:${{ github.sha }} --build-arg APP_VERSION=${{ github.ref_name }} --build-arg APP_COMMIT=${{ github.sha }} .
      - name: Smoke image
        run: |
          docker run -d --name smoke -e NUXT_DATABASE_URL=postgres://x:x@localhost:1/x -e SESSION_SECRET=x -e ENCRYPTION_KEY=x -e OTP_PEPPER=x -e WORKER_ENABLED=0 -p 3000:3000 lola/app:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
      # Образ для демо-стенда и прода: ghcr.io/<owner>/lola:latest и :<sha> (docs/26 §26.4)
      - name: Push to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/lola
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag lola/app:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag lola/app:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy-demo:
    needs: image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: "Deploy — ssh с forced command → scripts/deploy-demo.sh на стенде (docs/26 §26.4)"
        env:
          KEY: ${{ secrets.DEMO_SSH_KEY }}
          HOST: ${{ secrets.DEMO_SSH_HOST }}
          USER: ${{ secrets.DEMO_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ]; then echo "DEMO_SSH_KEY не задан — стенд не обновляется" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/demo && chmod 600 ~/.ssh/demo
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          OUT=$(ssh -i ~/.ssh/demo -o BatchMode=yes "$USER@$HOST" deploy)
          echo "$OUT"
          echo "### Демо-стенд обновлён" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "$OUT" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
