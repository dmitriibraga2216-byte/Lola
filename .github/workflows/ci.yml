name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lola
          POSTGRES_PASSWORD: lola_dev
          POSTGRES_DB: lola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lola -d lola"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://app_user:app_user_dev@localhost:5432/lola
      DATABASE_ADMIN_URL: postgres://lola:lola_dev@localhost:5432/lola
      PLATFORM_DATABASE_URL: postgres://platform_admin:platform_admin_dev@localhost:5432/lola
      ENCRYPTION_KEY: ci-encryption-key
      SESSION_SECRET: ci-session-secret
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: lola-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # MinIO для тестов S3 (PDF сертификата, медиа): у образа quay нет команды по умолчанию, поэтому не через services
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      # Build идёт до тестов: scopes-http.spec.ts гоняет собранное приложение
      - name: Tests (unit + integration + http)
        run: pnpm test

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (docs/06 §6.10 + сценарии этапов 8–10)
        run: pnpm test:e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (docs/26)
        run: docker build -f docker/Dockerfile -t lola/app:${{ github.sha }} --build-arg APP_VERSION=${{ github.ref_name }} --build-arg APP_COMMIT=${{ github.sha }} .
      - name: Smoke image
        run: |
          docker run -d --name smoke -e NUXT_DATABASE_URL=postgres://x:x@localhost:1/x -e SESSION_SECRET=x -e ENCRYPTION_KEY=x -e OTP_PEPPER=x -e WORKER_ENABLED=0 -p 3000:3000 lola/app:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
