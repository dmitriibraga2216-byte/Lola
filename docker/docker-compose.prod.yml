# Прод «конфігурація R1» (docs/26 «Розгортання R1», docs/32 §Б рядок 22): одна VM без
# публічного IP (Tailscale-only), TLS і вхід ззовні термінує Cloudflare — тунель ходить
# прямо в app:3000. Тому тут немає Caddy й немає відкритих портів у профілі за замовчуванням.
# Профіль `public` (сервіс `gateway`, Caddy) — резерв на випадок VM з білим IP (docs/27 §27.1
# «Проброс портів + Caddy»), у прийнятій R1 не запускається.
#
# Каталог розгортання (не в git): ~/lola-prod з .env (див. scripts/gen-env.sh) і cf/config.yml
# (див. scripts/first-run-prod.sh, docs/26). Запуск: ENV_FILE=./.env docker compose -f
# docker/docker-compose.prod.yml up -d --wait
name: lola-prod

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lola}
    # 4 ГБ RAM на всю VM (docs/32 §Г.1 Proxmox devbox): shared_buffers 512MB — четверть RAM,
    # обычная рекомендация для Postgres, а не «под завязку» лимита контейнера (1g ниже).
    command: postgres -c shared_buffers=512MB -c max_connections=60
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lola} -d ${POSTGRES_DB:-lola}"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources: { limits: { memory: 1g } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY?set in .env}
    volumes:
      - ${DATA_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources: { limits: { memory: 512m } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Одноразовий контейнер при кожному деплої: без цього оновлення образу лишає схему
  # старою (так уже було на демо-стенді 19.09 — 0020–0025 не накотились, docs/26 §26.8).
  migrate:
    image: ${APP_IMAGE:-ghcr.io/dmitriibraga2216-byte/lola}:${APP_TAG:-latest}
    env_file: ${ENV_FILE:-./.env}
    command: ["node", "--import", "tsx", "server/db/migrate.ts"]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  app:
    image: ${APP_IMAGE:-ghcr.io/dmitriibraga2216-byte/lola}:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-./.env}
    environment:
      # Воркер (pg-boss, ffmpeg) у тому ж процесі — окремий сервіс `worker` з docs/26 §26.4
      # надлишковий при 4 ГБ RAM на VM (docs/32 §Г.1); винести в другу VM можна без зміни
      # образу, коли черга виросте (docs/26 §26.11).
      WORKER_ENABLED: "1"
      OTP_DEBUG: "0"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources: { limits: { memory: 1536m } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Іменований тунель Cloudflare (docs/27 §27.4): вихідне з'єднання від сервера, портів
  # на VM не відкриваємо. `config.yml` і файл облікових даних тунелю — поза git, том
  # монтується лише на читання; заповнюються скриптом first-run-prod.sh за докс/26.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    volumes:
      - ${CF_DIR:-./cf}:/etc/cloudflared:ro
    depends_on:
      app: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 128m } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Профіль `public` — резерв для VM з білим IP (docs/27 §27.1, план Б): TLS і вхід тримає
  # Caddy, порти 80/443 відкриваються назовні. У прийнятій конфігурації R1 не піднімається.
  # Запуск за потреби: docker compose -f docker/docker-compose.prod.yml --profile public up -d gateway
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [public]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy:/data
    environment:
      APP_HOST: ${APP_HOST:-app.lola.local}
    depends_on: [app]
    deploy:
      resources: { limits: { memory: 128m } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
