# Прод на своём железе (docs/26 §26.4). Переменные — из /srv/lola/secrets/.env
name: lola

x-app: &app
  image: lola/app:${APP_VERSION:-latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-local}
  env_file: ${ENV_FILE:-/srv/lola/secrets/.env}
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  networks: [internal]

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lola}
    volumes:
      - ${DATA_DIR:-/srv/lola/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lola} -d ${POSTGRES_DB:-lola}"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources: { limits: { memory: 2g } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [internal]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - ${DATA_DIR:-/srv/lola/data}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources: { limits: { memory: 1g } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [internal]

  app:
    <<: *app
    environment:
      WORKER_ENABLED: "0"
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 1536m } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["node", ".output/server/index.mjs"]
    environment:
      WORKER_ENABLED: "1"
      PORT: "3001"
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 2g } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/srv/lola/data}/caddy:/data
    environment:
      APP_HOST: ${APP_HOST:-app.lola.local}
    depends_on: [app]
    deploy:
      resources: { limits: { memory: 256m } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on: [proxy]
    profiles: [tunnel]
    networks: [internal]

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( ( $$(date -d '03:00' +%s 2>/dev/null || date -j -f '%H:%M' '03:00' +%s) - $$(date +%s) + 86400 ) % 86400 ))
          f=/backups/db/lola-$$(date +%F).dump
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h db -U $$POSTGRES_USER -Fc $$POSTGRES_DB > $$f && echo "backup ok $$f"
          find /backups/db -name '*.dump' -mtime +30 -delete
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lola}
    volumes:
      - ${DATA_DIR:-/srv/lola}/backups:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
