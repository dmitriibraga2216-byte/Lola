<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Практикум — здача — Lola</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#E6DACA;display:flex;
align-items:flex-start;justify-content:center;padding:40px 20px;
font-family:"Nunito",system-ui,sans-serif;color:#0C0F14;-webkit-font-smoothing:antialiased}
.frame{border:2px solid #0C0F14;border-radius:26px;overflow:hidden;background:#FAF6EC}a{color:#0F6B60}</style>
</head><body><div class="frame" style="width:390px;height:844px;">
<div style="width:390px;height:844px;background:#F0E7D7;display:flex;flex-direction:column;padding:0;overflow:hidden;">
<div style="display:flex;align-items:center;gap:12px;padding:20px 20px 12px;"><button type="button" aria-label="Назад" style="border:none;background:none;padding:0;cursor:pointer;display:flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0C0F14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"/><path d="M11 18l-6-6 6-6"/></svg></button><div style="flex-grow:1;font-size:20px;font-weight:900;letter-spacing:-0.01em;">Практикум «Видача»</div></div>
<div style="padding:4px 20px 0;flex-grow:1;overflow:hidden;">
  <p style="margin:0 0 14px;font-size:16px;line-height:24px;">Зберіть замовлення на видачу і зніміть пакет зверху так, щоб було видно чек і склад.</p>
  <div style="background:#FAF6EC;border:2px solid #DCD0BC;border-radius:22px;padding:16px;margin-bottom:14px;">
    <div style="font-size:13px;font-weight:900;letter-spacing:0.06em;color:#5A6068;margin-bottom:10px;">ЩО ПЕРЕВІРЯЄ НАСТАВНИК</div>
    <div style="display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:21px;">
      <div style="display:flex;gap:9px;"><span style="color:#0F6B60;font-weight:900;">1</span><span>Чек прикріплений до пакета, номер видно</span></div>
      <div style="display:flex;gap:9px;"><span style="color:#0F6B60;font-weight:900;">2</span><span>Гаряче і холодне розкладені окремо</span></div>
      <div style="display:flex;gap:9px;"><span style="color:#0F6B60;font-weight:900;">3</span><span>Соуси і прибори за складом замовлення</span></div>
    </div>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:12px;">
    <div style="flex-grow:1;height:104px;border-radius:20px;background:#2BBFAE;"></div>
    <button type="button" style="width:104px;height:104px;border:2px dashed #B9A88C;background:#FAF6EC;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5A6068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2 2 0 015 6.5h2l1.5-2h7L17 6.5h2a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg><span style="font-size:12px;font-weight:800;">Ще фото</span></button>
  </div>
  <label for="wcomment" style="display:block;font-size:13px;font-weight:800;margin-bottom:6px;">Коментар для наставника</label>
  <textarea id="wcomment" rows="3" style="width:100%;border:2px solid #DCD0BC;border-radius:18px;padding:12px 14px;font-family:inherit;font-size:15px;background:#FAF6EC;color:#0C0F14;resize:none;">Соуси поклала збоку, щоб не придавило коробкою.</textarea>
</div>
<div style="padding:14px 20px 28px;display:flex;gap:12px;"><button type="button" style="width:100%;border:none;background:#FFC933;color:#0C0F14;border-radius:16px;padding:14px 22px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;">Відправити на перевірку</button></div></div></div></body></html>
